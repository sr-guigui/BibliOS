<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha - Bíblos</title>
    <link rel="stylesheet" href="BibliOS.css">


<body>

    <h1 class="titulo">Esqueceu a Senha</h1>

    <div class="caixa">

        <h2 class="logo">Bíblos</h2>

        <form>
            <input
                type="email"
                class="campo email"
                placeholder="Insira seu E-mail"
                required
            >

            <input
                type="text"
                class="campo menor"
                placeholder="Inserir código enviado no e-mail"
            >

            <input
                type="password"
                class="campo menor"
                placeholder="Criar nova senha"
            >

            <input
                type="password"
                class="campo menor"
                placeholder="Confirmar nova senha"
            >

            <button type="submit" class="botao">
                CONFIRMAR
            </button>
        </form>

    </div>

</body>
</html>
